<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FF6F00" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="14" fill="#0B132B" />

  <!-- Outer Handover Cycling Arrows -->
  <!-- Top-right clockwise arrow -->
  <path d="M 22 13 A 21 21 0 0 1 53 32" fill="none" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="53,24 57,34 47,34" fill="#00F0FF" transform="rotate(25 53 32)" />

  <!-- Bottom-left clockwise arrow -->
  <path d="M 42 51 A 21 21 0 0 1 11 32" fill="none" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="11,40 15,30 7,30" transform="rotate(-155 11 32)" fill="#00F0FF" />

  <!-- Central Industrial Gear / Cog -->
  <path d="
    M 30,19 L 34,19 L 34.5,21.5 L 37.5,22.8 L 39.5,21.2 L 42.5,24.2 L 40.9,26.2 L 42.2,29.2 L 44.7,29.7 L 44.7,33.7 L 42.2,34.2 L 40.9,37.2 L 42.5,39.2 L 39.5,42.2 L 37.5,40.6 L 34.5,41.9 L 34,44.4 L 30,44.4 L 29.5,41.9 L 26.5,40.6 L 24.5,42.2 L 21.5,39.2 L 23.1,37.2 L 21.8,34.2 L 19.3,33.7 L 19.3,29.7 L 21.8,29.2 L 23.1,26.2 L 21.5,24.2 L 24.5,21.2 L 26.5,22.8 L 29.5,21.5 Z
  " fill="#00C4FF" />

  <!-- Inner Bearing Hub Ring -->
  <circle cx="32" cy="31.7" r="7.5" fill="#0B132B" stroke="#00F0FF" stroke-width="2" />

  <!-- Intelligent Root-Cause AI Spark Core -->
  <circle cx="32" cy="31.7" r="4.2" fill="url(#hubGlow)" filter="url(#glow)" />
</svg>
